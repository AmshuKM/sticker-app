<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sticker Splitter</title>
<style>
body{font-family:system-ui,sans-serif;margin:16px;background:#f4f4f6;color:#222}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:10px 0}
input[type=number]{width:60px}
#swatches label{display:flex;align-items:center;gap:6px;padding:4px 8px;background:#fff;border-radius:6px;border:1px solid #ddd}
#swatches i{width:22px;height:22px;border-radius:4px;border:1px solid #0003}
#preview{background:repeating-conic-gradient(#e8e8e8 0 25%,#fff 0 50%) 0 0/20px 20px;border:1px solid #ccc;overflow:auto;max-height:75vh;cursor:crosshair}
#preview svg{display:block;height:auto}
.hint{color:#666;font-size:14px}
#thumb{border:1px solid #ccc;background:#fff;max-width:180px;max-height:180px}
#thumb[width="0"]{display:none}
</style></head><body>
<h1>Sticker Splitter</h1>
<div class="row">
  <input type="file" id="file" accept="image/*">
  <label>Colors <input type="number" id="k" min="2" max="16" value="4"></label>
  <label>Smoothing <input type="number" id="smooth" min="0" max="5" value="2"></label>
  <label>Merge pieces under (px) <input type="number" id="minArea" value="40"></label>
  <button id="go">Re-split</button>
</div>
<div class="row">
  <canvas id="thumb" width="0" height="0"></canvas>
  <label>Exposure <input type="range" id="exposure" min="-2" max="2" step="0.1" value="0"> <span id="evVal">0 EV</span></label>
  <label><input type="checkbox" id="rmbg"> Remove background (AI)</label>
  <span id="rmbgStatus" class="hint"></span>
</div>
<div id="swatches" class="row"></div>
<div class="row">
  <label><input type="checkbox" id="fill" checked> Color fill</label>
  <label><input type="checkbox" id="cut" checked> Cut lines</label>
  <select id="cutStyle"><option value="dotted">Dotted</option><option value="dashed">Dashed</option><option value="solid">Solid</option><option value="white">White border</option></select>
  <label>White border (px) <input type="number" id="border" min="1" max="40" value="8"></label>
  <select id="fmt"><option value="svg">SVG</option><option value="png">PNG</option><option value="pdf">PDF</option></select>
  <label>Sheet <select id="sheet"><option value="none">Fit to artwork</option><option value="a4">A4</option>
    <option value="letter">Letter</option><option value="a3">A3</option><option value="a5">A5</option></select></label>
  <label>Margin (mm) <input type="number" id="margin" min="0" max="50" value="10"></label>
  <button id="dl">Download</button>
  <span id="sizeInfo" class="hint"></span>
</div>
<div class="row">
  <button id="zoomOut">−</button><span id="zoomPct">100%</span><button id="zoomIn">+</button><button id="zoomFit">Fit</button>
  <button id="undo" disabled title="Ctrl+Z">Undo</button><button id="redo" disabled title="Ctrl+Y">Redo</button>
  <span class="hint">Click a piece in the preview to remove it (it becomes the surrounding color). Ctrl+scroll to zoom.</span>
</div>
<div id="preview"></div>
<script>
const $ = id => document.getElementById(id);
const MAX = 800;            // ponytail: working resolution cap; raise for finer cut lines (slower)
let img, origImg, cutImg, W, H, labels, pal, off = new Set(), layers = [], zoom = 1;

$('file').onchange = e => { const f = e.target.files[0]; if (!f) return;
  cutImg = null; $('rmbg').checked = false;
  origImg = img = new Image(); img.onload = split; img.src = URL.createObjectURL(f); };

// AI cut-out runs in the browser; the photo never leaves the machine (model files come from IMG.LY's CDN)
$('rmbg').onchange = async e => {
  if (!origImg) return (e.target.checked = false);
  if (e.target.checked && !cutImg) {
    e.target.disabled = true;
    $('rmbgStatus').textContent = 'Removing background… first run downloads the AI model (~40 MB)';
    try {
      const { removeBackground } = await import('https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.7.0/+esm');
      const im = new Image(); im.src = URL.createObjectURL(await removeBackground(origImg.src)); await im.decode();
      cutImg = im; $('rmbgStatus').textContent = '';
    } catch (err) {
      $('rmbgStatus').textContent = 'Background removal failed: ' + err.message; e.target.checked = false;
    }
    e.target.disabled = false;
  }
  img = e.target.checked ? cutImg : origImg; split();
};
$('go').onclick = () => img && split();
['fill', 'cut', 'cutStyle', 'border', 'sheet', 'margin'].forEach(id => $(id).onchange = render);
$('exposure').oninput = () => { $('evVal').textContent = (+$('exposure').value > 0 ? '+' : '') + $('exposure').value + ' EV'; img && drawThumb(); };
$('exposure').onchange = () => img && split();
$('dl').onclick = download;
$('undo').onclick = undo;
$('redo').onclick = redo;
document.addEventListener('keydown', e => {   // number boxes keep their own native undo
  if (!(e.ctrlKey || e.metaKey) || e.target.matches?.('input[type=number]')) return;
  const k = e.key.toLowerCase();
  if (k === 'y' || (k === 'z' && e.shiftKey)) { e.preventDefault(); redo(); }
  else if (k === 'z') { e.preventDefault(); undo(); } });
$('zoomIn').onclick = () => setZoom(zoom * 1.25);
$('zoomOut').onclick = () => setZoom(zoom / 1.25);
$('zoomFit').onclick = () => setZoom(1);
$('preview').addEventListener('wheel', e => { if (!e.ctrlKey) return; e.preventDefault(); setZoom(zoom * (e.deltaY < 0 ? 1.1 : 1 / 1.1)); }, { passive: false });
$('preview').onclick = removePiece;

// image pixels at w×h with exposure applied (2^EV gain; Uint8ClampedArray clips at 255)
function pixels(w, h) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d'); ctx.drawImage(img, 0, 0, w, h);
  const id = ctx.getImageData(0, 0, w, h), d = id.data, f = 2 ** +$('exposure').value;
  if (f !== 1) for (let i = 0; i < d.length; i++) if ((i & 3) !== 3) d[i] *= f;
  return id;
}
function drawThumb() {
  const s = Math.min(1, 180 / Math.max(img.width, img.height)), t = $('thumb');
  t.width = Math.round(img.width * s); t.height = Math.round(img.height * s);
  t.getContext('2d').putImageData(pixels(t.width, t.height), 0, 0);
}

function split() {
  drawThumb();
  const s = Math.min(1, MAX / Math.max(img.width, img.height));
  W = Math.round(img.width * s); H = Math.round(img.height * s);
  const d = pixels(W, H).data, lab = [];
  for (let i = 0; i < W * H; i++) lab.push(d[i * 4 + 3] < 128 ? null : rgb2lab(d[i * 4], d[i * 4 + 1], d[i * 4 + 2]));
  const centers = kmeans(lab, +$('k').value);
  labels = new Int16Array(W * H);
  for (let i = 0; i < W * H; i++) labels[i] = lab[i] ? nearest(centers, ...lab[i]) : -1;
  for (let n = +$('smooth').value; n--;) labels = modeFilter(labels);
  mergeSmall(+$('minArea').value);
  // sticker color = average of the real pixels it ended up with
  const sum = centers.map(() => [0, 0, 0, 0]);
  for (let i = 0; i < W * H; i++) if (labels[i] >= 0) { const s = sum[labels[i]]; s[0] += d[i * 4]; s[1] += d[i * 4 + 1]; s[2] += d[i * 4 + 2]; s[3]++; }
  pal = sum.map(s => s[3] ? [s[0] / s[3], s[1] / s[3], s[2] / s[3]].map(Math.round) : [0, 0, 0]);
  // all four corners the same color = flat background (sticker art); photos keep every color
  const corners = [0, W - 1, (H - 1) * W, H * W - 1].map(i => labels[i]);
  off = new Set(corners.every(c => c === corners[0]) ? [corners[0]] : []);
  build();
}

function build() {
  layers = pal.map((col, ci) => {
    const m = new Uint8Array(W * H); let any = 0;
    for (let i = 0; i < W * H; i++) if (labels[i] === ci) m[i] = any = 1;
    return any && { ci, col, cut: trace(m) };
  }).filter(Boolean);
  drawSwatches(); render();
}

// --- undo: every rendered change snapshots the whole state ---
const UNDO_MAX = 30;   // ponytail: ~1 MB per step (labels copy); cap keeps memory bounded
let history = [], future = [], current = null, restoring = false;
const controls = () => [...document.querySelectorAll('input[id]:not([type=file]), select[id]')];
const snapshot = () => ({ img, origImg, cutImg, W, H, pal, labels: labels.slice(), off: new Set(off),
  ctl: controls().map(el => el.type === 'checkbox' ? el.checked : el.value) });
function same(a, b) {
  if (a.img !== b.img || a.pal !== b.pal || a.labels.length !== b.labels.length || a.ctl.join() !== b.ctl.join() ||
    a.off.size !== b.off.size || [...a.off].some(v => !b.off.has(v))) return false;
  for (let i = 0; i < a.labels.length; i++) if (a.labels[i] !== b.labels[i]) return false;
  return true;
}
function commit() {
  if (restoring || !labels) return;
  const s = snapshot(); if (current && same(current, s)) return;   // zoom etc. don't count
  if (current) history.push(current);
  if (history.length > UNDO_MAX) history.shift();
  future = [];   // a new change drops the redo branch
  current = s; updateButtons();
}
const updateButtons = () => { $('undo').disabled = !history.length; $('redo').disabled = !future.length; };
function undo() { if (history.length) { future.push(current); restore(history.pop()); } }
function redo() { if (future.length) { history.push(current); restore(future.pop()); } }
function restore(s) {
  current = s;
  ({ img, origImg, cutImg, W, H, pal } = s); labels = s.labels.slice(); off = new Set(s.off);
  controls().forEach((el, i) => el.type === 'checkbox' ? el.checked = s.ctl[i] : el.value = s.ctl[i]);
  $('exposure').oninput();   // EV label + thumbnail
  restoring = true; build(); restoring = false;
  updateButtons();
}

// --- color clustering ---
const dist = (a, b) => (a[0]-b[0])**2 + (a[1]-b[1])**2 + (a[2]-b[2])**2;
const nearest = (pal, r, g, b) => { let bi = 0, bd = Infinity;
  pal.forEach((p, i) => { const dd = dist(p, [r, g, b]); if (dd < bd) { bd = dd; bi = i; } }); return bi; };

// sRGB → CIE Lab: distances match how different colors look (keeps maroon apart from black)
const LIN = Array.from({ length: 256 }, (_, v) => (v /= 255) <= 0.04045 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4);
function rgb2lab(r, g, b) {
  r = LIN[r]; g = LIN[g]; b = LIN[b];
  const f = t => t > 0.008856 ? Math.cbrt(t) : 7.787 * t + 16 / 116;
  const x = f((0.4124 * r + 0.3576 * g + 0.1805 * b) / 0.95047), y = f(0.2126 * r + 0.7152 * g + 0.0722 * b),
    z = f((0.0193 * r + 0.1192 * g + 0.9505 * b) / 1.08883);
  return [116 * y - 16, 500 * (x - y), 200 * (y - z)];
}

function kmeans(lab, k) {
  const pts = [], step = Math.max(1, Math.floor(W * H / 20000));
  for (let i = 0; i < W * H; i += step) if (lab[i]) pts.push(lab[i]);
  if (!pts.length) return [];
  // seed only from colors covering ≥0.5% of the image, so edge blends between two colors can't become a sticker
  const key = p => Math.round(p[0] / 8) + ',' + Math.round(p[1] / 8) + ',' + Math.round(p[2] / 8), cnt = new Map();
  pts.forEach(p => cnt.set(key(p), (cnt.get(key(p)) || 0) + 1));
  let seeds = pts.filter(p => cnt.get(key(p)) >= pts.length * 0.005); if (!seeds.length) seeds = pts;
  const c = [seeds.reduce((a, p) => cnt.get(key(p)) > cnt.get(key(a)) ? p : a).slice()];   // most common color first
  while (c.length < k) {                     // then farthest-point
    let best = -1, bi = 0;
    seeds.forEach((p, i) => { const m = Math.min(...c.map(q => dist(q, p))); if (m > best) { best = m; bi = i; } });
    c.push(seeds[bi].slice());
  }
  for (let it = 0; it < 15; it++) {
    const sum = c.map(() => [0, 0, 0, 0]);
    pts.forEach(p => { const s = sum[nearest(c, ...p)]; s[0] += p[0]; s[1] += p[1]; s[2] += p[2]; s[3]++; });
    sum.forEach((s, i) => { if (s[3]) c[i] = [s[0] / s[3], s[1] / s[3], s[2] / s[3]]; });
  }
  return c;
}

// 3x3 majority filter: kills anti-aliasing specks between colors
function modeFilter(L) {
  const out = new Int16Array(L.length), cnt = new Int16Array(20);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    cnt.fill(0); let best = L[y * W + x], bc = 0;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      const xx = x + dx, yy = y + dy; if (xx < 0 || yy < 0 || xx >= W || yy >= H) continue;
      const v = L[yy * W + xx] + 1; if (++cnt[v] > bc) { bc = cnt[v]; best = v - 1; }
    }
    out[y * W + x] = best;
  }
  return out;
}

// --- pieces: connected same-color regions, merged into the color that surrounds them most ---
function component(start, seen) {
  const ci = labels[start], pix = [start], nb = new Map(); seen[start] = 1;
  for (let k = 0; k < pix.length; k++) {
    const p = pix[k], x = p % W;
    for (const q of [x > 0 ? p - 1 : -1, x < W - 1 ? p + 1 : -1, p - W, p + W]) {
      if (q < 0 || q >= W * H) continue;
      if (labels[q] !== ci) nb.set(labels[q], (nb.get(labels[q]) || 0) + 1);
      else if (!seen[q]) { seen[q] = 1; pix.push(q); }
    }
  }
  let to = ci, best = 0; for (const [l, n] of nb) if (n > best) { best = n; to = l; }
  return { pix, to };
}
const fillWith = ({ pix, to }) => pix.forEach(p => labels[p] = to);
function mergeSmall(min) {
  const seen = new Uint8Array(W * H);
  for (let i = 0; i < W * H; i++) if (!seen[i]) { const c = component(i, seen); if (c.pix.length < min) fillWith(c); }
}

function removePiece(e) {
  const svg = $('preview').querySelector('svg'); if (!svg) return;
  const pt = new DOMPoint(e.clientX, e.clientY).matrixTransform(svg.querySelector('#art').getScreenCTM().inverse());
  const x = Math.floor(pt.x), y = Math.floor(pt.y); if (x < 0 || y < 0 || x >= W || y >= H) return;
  const p = y * W + x; if (off.has(labels[p]) || labels[p] < 0) return;
  const c = component(p, new Uint8Array(W * H)); if (c.to === labels[p]) return;
  fillWith(c); build();
}

// --- outline tracing: pixel-boundary edges chained into closed loops ---
function trace(m) {
  const inside = (x, y) => x >= 0 && y >= 0 && x < W && y < H && m[y * W + x];
  const W1 = W + 1, next = new Map();
  const add = (a, b) => (next.get(a) || next.set(a, []).get(a)).push(b);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (inside(x, y)) {
    const p = y * W1 + x;
    if (!inside(x, y - 1)) add(p, p + 1);
    if (!inside(x + 1, y)) add(p + 1, p + 1 + W1);
    if (!inside(x, y + 1)) add(p + 1 + W1, p + W1);
    if (!inside(x - 1, y)) add(p + W1, p);
  }
  const loops = [];
  for (const [start, arr] of next) while (arr.length) {   // every vertex has in==out, so walks always close
    const loop = []; let p = start;
    do { loop.push(p); p = next.get(p).pop(); } while (p !== start);
    const pts = loop.map(q => [q % W1, (q / W1) | 0]);
    // edge midpoints turn 1px staircases into clean diagonals
    loops.push(simplify(pts.map((a, i) => { const b = pts[(i + 1) % pts.length]; return [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2]; })));
  }
  return loops;
}
const simplify = pts => pts.filter((p, i) => {
  const a = pts[(i - 1 + pts.length) % pts.length], b = pts[(i + 1) % pts.length];
  return (p[0] - a[0]) * (b[1] - p[1]) !== (p[1] - a[1]) * (b[0] - p[0]); });

// --- output ---
const hex = c => '#' + c.map(v => v.toString(16).padStart(2, '0')).join('');
const pathD = loops => loops.map(lp => lp.map((p, i) => (i ? 'L' : 'M') + p[0] + ' ' + p[1]).join('') + 'Z').join('');
const DASH = { solid: [], dashed: [6, 4], dotted: [0, 3] };

// what to draw, in order; SVG and PDF both serialize this
function plan() {
  const L = layers.filter(l => !off.has(l.ci)), style = $('cutStyle').value, ops = [];
  if ($('fill').checked) L.forEach(l => ops.push({ loops: l.cut, fill: l.col }));
  if ($('cut').checked) L.forEach(l => ops.push(style === 'white'
    ? { loops: l.cut, stroke: [255, 255, 255], width: +$('border').value, dash: [] }   // white gap between pieces
    : { loops: l.cut, stroke: [255, 0, 0], width: 1, dash: DASH[style] }));
  return { ops, ...sheetFit(W, H) };
}

// page size in pt; artwork scaled to fit inside margins, centered, best orientation
const SHEETS = { a4: [595.28, 841.89], letter: [612, 792], a3: [841.89, 1190.55], a5: [419.53, 595.28] };
function sheetFit(tw, th) {
  const sh = SHEETS[$('sheet').value];
  if (!sh) return { pw: tw, ph: th, k: 1, ox: 0, oy: 0, sheet: false };   // 1px = 1pt
  const m = +$('margin').value * 72 / 25.4, fit = ([w, h]) => Math.min((w - 2 * m) / tw, (h - 2 * m) / th);
  const [pw, ph] = fit([sh[1], sh[0]]) > fit(sh) ? [sh[1], sh[0]] : sh, k = fit([pw, ph]);
  return { pw, ph, k, ox: (pw - tw * k) / 2, oy: (ph - th * k) / 2, sheet: true };
}
const ptToCm = v => (v / 72 * 2.54).toFixed(1);

function svgString() {
  const { ops, pw, ph, k, ox, oy, sheet } = plan(); let fills = '', cuts = '';
  ops.forEach(o => o.fill
    ? fills += `<path d="${pathD(o.loops)}" fill="${hex(o.fill)}" fill-rule="evenodd"/>`
    : cuts += `<path d="${pathD(o.loops)}" fill="none" stroke="${hex(o.stroke)}" stroke-width="${o.width}" stroke-linecap="round" stroke-linejoin="round"` +
      (o.dash.length ? ` stroke-dasharray="${o.dash.join(' ')}"` : '') + '/>');
  const u = v => sheet ? (v / 72 * 25.4).toFixed(2) + 'mm' : v;
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${u(pw)}" height="${u(ph)}" viewBox="0 0 ${pw} ${ph}"><g id="art" transform="translate(${ox} ${oy}) scale(${k})">` +
    (fills && `<g id="Print">${fills}</g>`) + (cuts && `<g id="CutContour">${cuts}</g>`) + '</g></svg>';
}

function pdfBlob() {                          // hand-rolled vector PDF in pt
  const { ops, pw, ph, k, ox, oy } = plan();
  const path = loops => loops.map(lp => lp.map((p, i) => `${p[0]} ${p[1]} ${i ? 'l' : 'm'}`).join('\n') + '\nh').join('\n') + '\n';
  const rgb = c => c.map(v => (v / 255).toFixed(3)).join(' ');
  let s = `${k} 0 0 ${-k} ${ox} ${ph - oy} cm\n`;
  ops.forEach(o => s += o.fill ? `${rgb(o.fill)} rg\n${path(o.loops)}f*\n`
    : `${rgb(o.stroke)} RG ${o.width} w 1 J 1 j [${o.dash.join(' ')}] 0 d\n${path(o.loops)}S\n`);
  const objs = ['<< /Type /Catalog /Pages 2 0 R >>', '<< /Type /Pages /Kids [3 0 R] /Count 1 >>',
    `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pw} ${ph}] /Contents 4 0 R >>`,
    `<< /Length ${s.length} >>\nstream\n${s}endstream`];
  let out = '%PDF-1.4\n'; const offs = [];
  objs.forEach((o, i) => { offs.push(out.length); out += `${i + 1} 0 obj\n${o}\nendobj\n`; });
  const x = out.length;
  out += `xref\n0 ${objs.length + 1}\n0000000000 65535 f \n` + offs.map(o => String(o).padStart(10, '0') + ' 00000 n \n').join('') +
    `trailer\n<< /Size ${objs.length + 1} /Root 1 0 R >>\nstartxref\n${x}\n%%EOF`;
  return new Blob([out], { type: 'application/pdf' });
}

async function pngBlob() {
  const im = new Image(); im.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgString()); await im.decode();
  const { pw, ph, sheet } = plan(), dpi = sheet ? 300 / 72 : 2;   // sheets export at 300 DPI
  const c = document.createElement('canvas'); c.width = Math.round(pw * dpi); c.height = Math.round(ph * dpi);
  c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
  return new Promise(r => c.toBlob(r, 'image/png'));
}

async function download() {
  if (!layers.length) return alert('Upload an image first.');
  const fmt = $('fmt').value;
  const blob = fmt === 'svg' ? new Blob([svgString()], { type: 'image/svg+xml' }) : fmt === 'pdf' ? pdfBlob() : await pngBlob();
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'stickers.' + fmt; a.click();
}

function drawSwatches() {
  $('swatches').innerHTML = '';
  layers.forEach(l => {
    const lab = document.createElement('label');
    lab.innerHTML = `<input type="checkbox" ${off.has(l.ci) ? '' : 'checked'}><i style="background:${hex(l.col)}"></i>${hex(l.col)} · ${l.cut.length} pieces`;
    lab.querySelector('input').onchange = e => { e.target.checked ? off.delete(l.ci) : off.add(l.ci); render(); };
    $('swatches').append(lab);
  });
}
function setZoom(z) { zoom = Math.min(10, Math.max(0.2, z)); $('zoomPct').textContent = Math.round(zoom * 100) + '%'; render(); }
function render() {
  if (!layers.length) return;
  $('preview').innerHTML = svgString();
  const svg = $('preview').querySelector('svg'), { k, sheet } = plan();
  svg.style.width = zoom * 100 + '%';   // 100% = fit to window
  svg.style.background = sheet ? '#fff' : '';
  $('sizeInfo').textContent = `Prints at ${ptToCm(W * k)} × ${ptToCm(H * k)} cm`;
  commit();
}
</script>
</body></html>
